name: KitsPlugin
version: 1.0.0
main: com.xyron.kits.KitsPlugin
api-version: '1.21'
description: Save inventories as kits and give them to players, with except lists.
commands:
  kit:
    description: Manage and give kits
    aliases: [kits]
    usage: /kit <create|saved|take|give|delete>
permissions:
  kits.admin:
    description: Use all kit commands
    default: op
